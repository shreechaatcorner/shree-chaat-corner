name: Build Shree Chaat Corner Owner APK
on:
  push:
    paths:
      - 'android-owner/**'
      - 'owner.html'
      - 'firebase-config.js'
      - '.github/workflows/build-owner-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android-owner
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Shree-Chaat-Corner-Owner-APK
          path: android-owner/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
