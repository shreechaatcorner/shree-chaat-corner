<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shree Chaat Corner</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#fffaf5;color:#292524}
  header{background:linear-gradient(135deg,#f97316,#c2410c);color:white;text-align:center;padding:15px}
  nav{display:flex;gap:5px;overflow-x:auto;background:white;padding:8px;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
  nav button{border:0;border-radius:20px;background:#ffedd5;padding:8px 12px;color:#9a3412;font-weight:bold;cursor:pointer}
  main{max-width:800px;margin:auto;padding:10px} .page{display:none} .page.active{display:block}
  .card,.panel{background:white;border:1px solid #f1dfce;border-radius:12px;padding:12px;margin:10px 0}
  .menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .card img{width:100%;height:100px;object-fit:cover;border-radius:8px;background:#ffedd5}
  .btn{border:0;border-radius:8px;padding:10px 14px;background:#ea580c;color:white;font-weight:bold;cursor:pointer;margin:4px}
  input,textarea{width:100%;padding:10px;border:1px solid #d6d3d1;border-radius:8px;margin:5px 0}
</style>
</head>
<body>
<header><h1>🥗 Shree Chaat Corner</h1><p>Good Food • Good Mood ❤️</p></header>
<nav>
  <button onclick="showPage('home')">🏠 Home</button>
  <button onclick="showPage('menuPage')">🍽️ Menu</button>
  <button onclick="showPage('cartPage')">🛒 Cart</button>
  <button onclick="showPage('history')">📋 History</button>
</nav>
<main>
  <section id="home" class="page active">
    <div class="card" style="text-align:center;background:#ffedd5;">
      <h2>Welcome!</h2><p>Tasty snacks, chaat, and meals at affordable prices in Chennai.</p>
      <button class="btn" onclick="showPage('menuPage')">Explore Menu</button>
    </div>
  </section>
  <section id="menuPage" class="page">
    <h2>🍽️ Our Full Menu</h2><div id="menu" class="menu"></div>
  </section>
  <section id="cartPage" class="page">
    <h2>🛒 Checkout & Location</h2>
    <div class="panel">
      <div id="cart">Cart is empty.</div><h4>Total: ₹<span id="grand">0</span></h4>
      <input id="customer" placeholder="Your Name">
      <input id="phone" placeholder="Mobile Number">
      <textarea id="customerAddress" placeholder="Address"></textarea>
      <button class="btn" style="background:#16803c; width:100%;" onclick="getLocation()">📍 Use Current Location</button>
      <div id="locStatus" style="font-size:12px;color:#c2410c;"></div>
      <button class="btn" style="width:100%;" onclick="placeOrder()">Order on WhatsApp</button>
    </div>
  </section>
  <section id="history" class="page">
    <h2>📋 Order History</h2><div id="historyList">No orders yet.</div>
  </section>
</main>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA-Ca_4iUpLSc9MRY9W7xczhEvzQeZGa_U", authDomain: "shree-chaat-corner.firebaseapp.com",
    projectId: "shree-chaat-corner", storageBucket: "shree-chaat-corner.appspot.com",
    messagingSenderId: "197160794283", appId: "1:197160794283:web:48971b82bb1b42fdaf1fee"
  };
  const app = initializeApp(firebaseConfig); const db = getFirestore(app);

  const items=[
    {id:1,name:"Samosa",price:15,s:"samosa"},{id:2,name:"Kachori",price:20,s:"kachori"},{id:3,name:"Samosa Chaat",price:50,s:"samosa chaat"},{id:4,name:"Kachori Chaat",price:50,s:"kachori chaat"},{id:5,name:"Sundal Chaat",price:40,s:"sundal"},{id:6,name:"Pani Puri",price:30,s:"pani puri"},{id:7,name:"Dahi Puri",price:35,s:"dahi puri"},{id:8,name:"Cheese Puri",price:65,s:"cheese puri"},{id:9,name:"Sev Puri",price:45,s:"sev puri"},{id:10,name:"Veg Bread Sandwich",price:40,s:"sandwich"},{id:11,name:"Veg Bread Cheese",price:50,s:"cheese sandwich"},{id:12,name:"Murukku Sandwich",price:60,s:"murukku"},{id:13,name:"Murukku Cheese",price:70,s:"murukku cheese"},{id:14,name:"Khakhra Sandwich",price:70,s:"khakhra"},{id:15,name:"Khakhra Cheese",price:90,s:"khakhra cheese"},{id:16,name:"Roti Sabji",price:30,s:"roti"},{id:17,name:"Triangle Paratha",price:40,s:"paratha"},{id:18,name:"Methi Paratha",price:50,s:"methi"},{id:19,name:"Aaloo Paratha",price:60,s:"aloo"},{id:20,name:"Special Sabji",price:50,s:"curry"},{id:21,name:"Water Bottle 10",price:10,s:"water"},{id:22,name:"Water Bottle 20",price:20,s:"water bottle"},{id:23,name:"Cool Drink 10",price:10,s:"cold drink"},{id:24,name:"Cool Drink 20",price:20,s:"cool drink"}
  ];
  const cart = {};

  window.showPage = (id) => {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    if(id === 'history') renderHistory();
  };

  function renderMenu() {
    let html = "";
    items.forEach(i => {
      const qty = cart[i.id] || 0;
      html += `<div class="card">
        <img src="https://loremflickr.com/400/300/${encodeURIComponent(i.s)}?lock=${i.id}">
        <div><b>${i.name}</b><br>₹${i.price}</div>
        <div>
          ${qty > 0 ? `<button class="btn" onclick="change(${i.id}, -1)">-</button> ${qty} <button class="btn" onclick="change(${i.id}, 1)">+</button>` : `<button class="btn" onclick="change(${i.id}, 1)">Add</button>`}
        </div>
      </div>`;
    });
    document.getElementById("menu").innerHTML = html;
  }
  renderMenu();

  window.change = (id, n) => {
    cart[id] = (cart[id] || 0) + n;
    if (cart[id] <= 0) delete cart[id];
    renderMenu(); renderCart();
  };

  function renderCart() {
    let html = ""; let total = 0;
    items.forEach(i => {
      if(cart[i.id]) {
        total += i.price * cart[i.id];
        html += `<div>${i.name} x ${cart[i.id]} = ₹${i.price * cart[i.id]}</div>`;
      }
    });
    document.getElementById("cart").innerHTML = html || "Cart is empty.";
    document.getElementById("grand").textContent = total;
  }

  window.getLocation = () => {
    const s = document.getElementById("locStatus"); s.textContent = "📍 Locating...";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        document.getElementById("customerAddress").value = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
        s.textContent = "✅ Location Added!";
      },
      () => { s.textContent = "❌ GPS blocks on local files. Works automatically on secure HTTPS (like tiiny.host)!"; }
    );
  };

  window.placeOrder = async () => {
    const name = document.getElementById("customer").value;
    const phone = document.getElementById("phone").value;
    const addr = document.getElementById("customerAddress").value;
    if(!name || !phone) return alert("Please fill Name and Phone!");

    let total = 0; let summary = "";
    items.forEach(i => {
      if(cart[i.id]) {
        total += i.price * cart[i.id];
        summary += `\n- ${i.name} x ${cart[i.id]}`;
      }
    });
    if(total === 0) return alert("Cart is empty!");

    try {
      const docRef = await addDoc(collection(db, "orders"), { name, phone, address: addr, items: cart, total, timestamp: new Date() });
      const orderId = docRef.id.slice(-6).toUpperCase();
      let history = JSON.parse(localStorage.getItem("orders") || "[]");
      history.push({ id: orderId, name, items: summary, total, status: "Order Placed", date: new Date().toLocaleDateString() });
      localStorage.setItem("orders", JSON.stringify(history));

      const text = `*Shree Chaat Corner Order*\n*Order ID:* ${orderId}\n*Name:* ${name}\n*Location:* ${addr}\n\n*Items Ordered:*${summary}\n\n*Total:* ₹${total}\n\n_Track status using ID: ${orderId}_`;
      window.open("https://wa.me/918428656328?text=" + encodeURIComponent(text));
    } catch (e) { alert("Error: " + e.message); }
  };

  function renderHistory() {
    let history = JSON.parse(localStorage.getItem("orders") || "[]");
    let html = history.map(o => `
      <div class="card" style="text-align:left;">
        <b>Order ID: ${o.id}</b> (${o.date})<br>
        <span style="font-size:13px;color:#666;">${o.items.replace(/\n/g, '<br>')}</span><br>
        <b>Total: ₹${o.total}</b> | Status: <span style="color:#ea580c;font-weight:bold;">${o.status}</span>
      </div>`).join("");
    document.getElementById("historyList").innerHTML = html || "No orders yet.";
  }
</script>
</body>
</html>
